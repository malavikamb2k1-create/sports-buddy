{% extends "base.html" %}
{% block title %}Home - SportsBuddy{% endblock %}

{% block content %}
<h1 class="page-title">Sports Events Near You</h1>

<div class="event-list">
    {% for event in events %}
    <div class="event-card">
        <h2>{{ event.name }}</h2>
        <p><strong>Sport:</strong> {{ event.sport }}</p>
        <p><strong>Date:</strong> {{ event.date }}</p>
        <p><strong>Location:</strong> {{ event.location }}</p>
    </div>
    {% endfor %}
</div>

{% endblock %}
